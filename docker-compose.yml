version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: talentmatch-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: talentmatch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d talentmatch"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: talentmatch-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: talentmatch-api
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/talentmatch
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - uploads_data:/app/uploads

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: talentmatch-worker
    command: celery -A backend.app.tasks.processing_tasks.celery_app worker --loglevel=info -c 2
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/talentmatch
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
